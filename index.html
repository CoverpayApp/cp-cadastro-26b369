<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cadastro CoverPay</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#1f2937;
    background:#f4f7fb; min-height:100vh; display:grid; place-items:center; padding:20px}
  .gate{width:100%; max-width:360px; background:#fff; border:1px solid #e5e9f0; border-radius:14px;
    padding:26px 22px; box-shadow:0 8px 28px rgba(0,0,0,.06); text-align:center}
  .marca{font-weight:700; color:#1777CF; font-size:20px; margin-bottom:6px}
  .hint{color:#6b7280; font-size:14px; margin:0 0 18px}
  input{width:100%; font:inherit; padding:12px; border:1px solid #cfd6e2; border-radius:8px; outline:none; margin-bottom:12px}
  input:focus{border-color:#1777CF}
  button{width:100%; padding:13px; border:1px solid #1777CF; border-radius:9px; background:#1777CF; color:#fff;
    font:inherit; font-weight:600; cursor:pointer}
  button:hover{background:#006FE6}
  button:disabled{opacity:.6; cursor:default}
  .err{color:#dc2626; font-size:13px; margin:12px 0 0}
</style>
</head>
<body>
<form class="gate" id="f">
  <div class="marca">Cadastro CoverPay</div>
  <p class="hint">Digite a senha para abrir.</p>
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" autofocus>
  <button type="submit" id="b">Entrar</button>
  <p class="err" id="err" hidden>Senha incorreta.</p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  window.__SENHA__=pw;   // o wizard deriva a propria chave de persistencia (salt proprio, estavel entre publicacoes)
  return new TextDecoder().decode(plain);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err"), b=document.getElementById("b");
  err.hidden=true; b.disabled=true; b.textContent="Abrindo…";
  try{
    const html=await abrir(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();   // o HTML decifrado assume a página e roda seu script
  }catch(_){ err.hidden=false; b.disabled=false; b.textContent="Entrar"; }
});
